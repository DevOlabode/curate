name: Bug report
description: Something in Curate does not work as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Curate. Search [existing issues](https://github.com/DevOlabode/curate/issues) first.

        Security problems belong in a [private advisory](https://github.com/DevOlabode/curate/security/advisories/new), not here.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Extension popup
        - Extension options
        - API / server
        - Landing page
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A short summary of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Curate popup
        2. Click …
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Edge
        - Both
        - N/A (API or docs)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension or app version
      description: Popup version is in `extension/manifest.json`. Leave blank if unknown.
      placeholder: "1.0.1"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS: Ubuntu 24.04
        Browser version: Chrome 128
        Running against: production API / localhost:3000
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: Redact tokens, passwords, and personal bookmarks.
