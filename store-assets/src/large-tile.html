<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;650;700&family=Fraunces:opsz,wght@9..144,500;9..144,650&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1400px; height: 560px; overflow: hidden; }
    body {
      background: #f4efe6;
      color: #1a1612;
      font-family: Figtree, system-ui, sans-serif;
      display: flex;
      align-items: center;
      padding: 0 96px;
      gap: 72px;
    }
    svg { display: block; width: 220px; height: 220px; flex-shrink: 0; }
    .copy { max-width: 820px; }
    .eyebrow {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #c4491d;
      margin-bottom: 16px;
    }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-size: 92px;
      font-weight: 500;
      letter-spacing: -0.045em;
      line-height: 0.95;
      margin-bottom: 18px;
    }
    p {
      font-size: 28px;
      font-weight: 500;
      line-height: 1.35;
      color: #3d342c;
      max-width: 18em;
    }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#c4491d" aria-hidden="true">
    <path d="M7 3.5A2.5 2.5 0 0 0 4.5 6v15.1l7.5-4.4 7.5 4.4V6A2.5 2.5 0 0 0 17 3.5H7z"></path>
  </svg>
  <div class="copy">
    <p class="eyebrow">Chrome and Edge extension</p>
    <h1>Curate</h1>
    <p>Keep the links you actually return to.</p>
  </div>
</body>
</html>
