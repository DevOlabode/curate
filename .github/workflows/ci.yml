name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Each build checks its own manifest: permissions allowlist, and no
      # localhost or staging URL in the production build.
      - name: Build extension (production)
        run: npm run build:extension:production

      - name: Build extension (staging)
        run: npm run build:extension:staging
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL || 'https://staging.example.invalid' }}

      - name: Upload staging extension
        if: github.ref == 'refs/heads/staging'
        uses: actions/upload-artifact@v4
        with:
          name: curate-extension-staging
          path: dist/extension
