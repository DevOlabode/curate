name: Feature request
description: Suggest an idea for Curate
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Open an issue before a large PR. Small docs or bug-fix PRs do not need an issue first. See [CONTRIBUTING.md](https://github.com/DevOlabode/curate/blob/main/CONTRIBUTING.md).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Extension popup
        - Extension options
        - API / server
        - Landing page
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today? A feature request should start from a real problem.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like Curate to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I am willing to work on this
        - label: This can stay a small, focused change
